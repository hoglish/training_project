services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: ${PGDATA_PATH}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ${INIT_SCRIPTS_PATH}:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fitness_network

  backend:
    build: ./backend
    container_name: fitness_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:3000"
    environment:
      # Внутри Docker сеть называется "postgres", а не localhost!
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      PORT: 3000
    volumes:
      # Монтируем папку с кодом, чтобы работал hot-reload
      - ./backend:/usr/src/app
      # Защищаем node_modules от затирания
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fitness_network

volumes:
  pg_data:
    driver: local

networks:
  fitness_network:
    driver: bridge